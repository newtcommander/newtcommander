# Newt Commander shipped-language registry.
#
# Read by tools/translate (merge/machine-translation), by
# src\vcxproj\lang_policy.ps1 (validation + output reconciliation, every build)
# and by src\vcxproj\build_langs.cmd (production, full builds only) -- both via
# read_languages.ps1.
#
# This file is also the BUILD POLICY for languages: every section carries an
# "enabled" field deciding whether that language is built and shipped. It is
# the language counterpart of plugins.cfg. See feature 039.
#
# Encoding: UTF-8 without BOM. Sections are language folder names under
# translations\. English is NOT listed -- it is compiled from the .rc sources
# and is always present.
#
# Fields
#   langid        Windows LANGID written to VarFileInfo\Translation in the .slg.
#                 Must be unique. This is what the language chooser matches
#                 against the user's Windows display language.
#   display_name  Shown in the language chooser.
#   author        Original translator credits. PRESERVED VERBATIM -- see
#                 FR-020. Do not replace these with the project name.
#   web           Contact address shown in the chooser. The predecessor
#                 vendor's forum URLs were removed, not repointed (FR-019).
#   comment       Native-language description of the translation.
#   helpdir       Help subdirectory. ENGLISH for every language -- localized
#                 help files are out of scope for feature 038.
#   origin        human  - fully human-authored
#                 mixed  - human translation plus machine-filled gaps
#                 machine- entirely machine-produced
#                 Anything other than "human" gets a non-empty SLGIncomplete
#                 so the product tells the user the translation is not
#                 fully human-reviewed (FR-016).
#
#   enabled       on  - built for every enabled module and shipped
#                 off - not built; any existing module for it is REMOVED
#                       from the build output on the next build.
#                       Translation source under translations\<folder>\ is
#                       never touched, so re-enabling costs nothing
#                       (feature 039, FR-004/FR-005).
#                 Required in every section -- a missing or unrecognized
#                 value fails the build before MSBuild runs, naming the
#                 section.
#
# See specs/038-translations-build-integration/data-model.md
#     specs/039-language-build-policy/contracts/languages-cfg.md

[czech]
langid       = 1029
display_name = Czech
