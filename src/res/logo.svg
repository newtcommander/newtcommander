<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="nc-bg" gradientUnits="userSpaceOnUse" cx="128" cy="64" r="256"><stop offset="0" stop-color="#1B3054"></stop><stop offset="1" stop-color="#070E1A"></stop></radialGradient>
    <linearGradient id="nc-fold" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="192"><stop offset="0" stop-color="#FFB35C"></stop><stop offset="0.55" stop-color="#F97316"></stop><stop offset="1" stop-color="#EA6A0B"></stop></linearGradient>
    <linearGradient id="nc-back" gradientUnits="userSpaceOnUse" x1="0" y1="74" x2="0" y2="124"><stop offset="0" stop-color="#D96A15"></stop><stop offset="1" stop-color="#B85306"></stop></linearGradient>
    <linearGradient id="nc-shade" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="192"><stop offset="0.55" stop-color="#B85306" stop-opacity="0"></stop><stop offset="1" stop-color="#8A3E04" stop-opacity="0.45"></stop></linearGradient>
    <linearGradient id="nc-gloss" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="148"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
  </defs>
  <!-- nanosvg-safe variant of newt-commander-icon.svg (no filter/clipPath).
       Constraints of the bundled nanosvg (src/common/dep/nanosvg): width/height
       MUST equal the viewBox size (a mismatch scales shapes but not gradient
       transforms) and gradients use userSpaceOnUse coordinates. Tile = dark
       edge rect + inset radial disc (6 px bottom lip keeps the extruded look
       the master gets from its clipped, up-shifted fill). -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#02060D"></rect>
  <rect x="2" y="2" width="252" height="248" rx="54" fill="url(#nc-bg)"></rect>
  <rect x="2" y="2" width="252" height="123" rx="54" fill="#FFFFFF" opacity="0.06"></rect>
  <g transform="translate(128 132) scale(1.16) translate(-128 -132)">
    <rect x="56" y="74" width="92" height="50" rx="16" fill="url(#nc-back)"></rect>
    <rect x="56" y="74" width="92" height="22" rx="11" fill="#FFFFFF" opacity="0.22"></rect>
    <g transform="rotate(4 128 110)"><rect x="84" y="72" width="96" height="60" rx="9" fill="#EAF2FB"></rect></g>
    <g transform="rotate(-4 128 110)">
      <rect x="72" y="76" width="112" height="64" rx="9" fill="#FDFEFF"></rect>
      <rect x="88" y="88" width="64" height="7" rx="3.5" fill="#93C5FD"></rect>
      <rect x="88" y="100" width="44" height="7" rx="3.5" fill="#93C5FD"></rect>
    </g>
    <rect x="50" y="104" width="156" height="88" rx="22" fill="url(#nc-fold)"></rect>
    <rect x="50" y="104" width="156" height="44" rx="22" fill="url(#nc-gloss)"></rect>
    <rect x="58" y="108" width="140" height="12" rx="6" fill="#FFFFFF" opacity="0.3"></rect>
    <rect x="50" y="104" width="156" height="88" rx="22" fill="url(#nc-shade)"></rect>
    <rect x="76" y="140" width="64" height="14" rx="7" fill="#FFD9AE"></rect>
    <circle cx="164" cy="147" r="7" fill="#FFC98F"></circle>
  </g>
</svg>
